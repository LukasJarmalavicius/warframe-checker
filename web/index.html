<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>warframe-checker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="page">
        <header>
            <p class="eyebrow">Field-certified</p>
            <h1>warframe-checker</h1>
            <p class="intro">Paste prime parts here.</p>
        </header>

        <section class="panel auth-panel" aria-labelledby="auth-title">
            <h2 id="auth-title">Account</h2>
            <form id="authForm" class="auth-form">
                <div class="field">
                    <label for="usernameInput">Username</label>
                    <input id="usernameInput" name="username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="passwordInput">Password</label>
                    <input id="passwordInput" name="password" type="password" autocomplete="current-password" required>
                </div>
                <div class="controls">
                    <button id="loginButton" type="submit">Log in</button>
                    <button id="registerButton" type="button" class="secondary">Register</button>
                </div>
                <p id="authError" class="auth-error" hidden></p>
            </form>
            <div id="authStatus" class="auth-status" hidden>
                <span>Logged in as <strong id="currentUser"></strong></span>
                <button id="logoutButton" type="button" class="secondary">Log out</button>
            </div>
        </section>

        <section class="panel input-panel" aria-labelledby="input-title">
            <h2 id="input-title">Your inventory</h2>
            <label for="inventoryInput">One item per line</label>
            <textarea id="inventoryInput" placeholder="Example:&#10;Volt Prime Blueprint&#10;Volt Prime Chassis&#10;Braton Prime Barrel"></textarea>
            <div class="controls">
                <button id="submitButton" type="button">Check inventory</button>
                <label class="check-control" for="jsonCheck">
                    <input type="checkbox" id="jsonCheck" name="jsonCheck">
                    Paste JSON
                </label>
            </div>
        </section>

        <section class="results" aria-live="polite" aria-labelledby="results-title">
            <div class="results-header">
                <h2 id="results-title">Missing Prime parts</h2>
                <span id="status" class="status">Waiting for an inventory check</span>
            </div>
            <div id="summary" class="summary" hidden></div>
            <div id="result" class="empty">Results will appear here.</div>
            <div id="itemResults" class="item-results" hidden>
                <h2>Checked items</h2>
                <div id="itemList"></div>
            </div>
        </section>

        <details>
            <summary>Details</summary>
            <pre id="test"></pre>
        </details>
    </main>

    <script src="/dist/main.js"></script>
</body>
</html>
